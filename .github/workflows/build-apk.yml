name: Build Mandal Engineering Works APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -q Mandal_Engineering_Works_Android_Studio_Project_FULL.zip
          echo "Project extracted"
          ls -la MEW_Android_Project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: MEW_Android_Project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mandal-Engineering-Works-APK
          path: MEW_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
